<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trolic · browser integration</title><style>body{max-width:760px;margin:40px auto;padding:20px;background:#f5f4ee;color:#18251f;font:16px/1.6 system-ui}textarea{width:100%;height:160px;box-sizing:border-box}button{padding:10px;margin:8px 8px 8px 0}#stage{width:300px;height:300px;border:1px solid #9cad9e}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Local motion, typed integration.</h1><p>This repository example loads the local bundled Lottie-web player. No CDN or AI service. Serve the repository over HTTP.</p><div id="stage"></div><textarea id="source" aria-label="Animation source">canvas 300 300 dur=2
circle dot p=[150,150] s=[64,64] f=#60987b t=[["s",[[0,[64,64]],[1,[110,110]],[2,[64,64]]],"ease_in_out"]]</textarea><button id="update">Apply source</button><button id="pause">Pause</button><button id="play">Play</button><pre id="status" role="status"></pre><script src="../../vendor/lottie_light.min.js"></script><script type="module">
import {createTrolicPlayer} from '../../player.js';
const el=id=>document.getElementById(id);let player;
async function update(){try{if(player)await player.setSource(el('source').value);else player=await createTrolicPlayer(el('stage'),{lottie:window.lottie,source:el('source').value,label:'Pulsing circle'});el('status').textContent=JSON.stringify(player.report,null,2);}catch(error){el('status').textContent=error.message;}}
el('update').onclick=update;el('pause').onclick=()=>player?.pause();el('play').onclick=()=>player?.play();window.addEventListener('pagehide',()=>player?.destroy());update();
</script></html>
